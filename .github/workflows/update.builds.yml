```yaml
name: Update WoW Builds

on:
  schedule:
    - cron: "17,47 * * * *"

  workflow_dispatch:

jobs:

  update-builds:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Warcraft Logs build collector
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
        run: |
          python wcl-build-test.py

      - name: Commit updated builds
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add builds.json

          git diff --cached --quiet || \
            git commit -m "Update WoW builds"

          git push
```
