<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Nat's WoW Macros</title>
    <style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    
    :root {
        --bg: #080d0a;
        --panel: #0d1711;
        --panel2: #111d15;
        --border: #1d3324;
        --green: #8cff45;
        --green2: #3fb52e;
        --green3: #b7ff82;
        --text: #e6eee7;
        --muted: #84958a;
    }
    
    html {
        scroll-behavior: smooth;
    }
    
    body {
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, Segoe UI, Arial, sans-serif;
    }
    
    body:before {
        content: "";
        position: fixed;
        inset: 0;
        background:
            linear-gradient(rgba(5,15,8,.82), rgba(5,12,7,.94)),
            url("images/background.jpg") center/cover no-repeat;
        z-index: -2;
    }
    
    body:after {
        content: "";
        position: fixed;
        inset: 0;
        background:
            radial-gradient(
                circle at 50% 20%,
                rgba(91,255,50,.12),
                transparent 40%
            ),
            linear-gradient(
                90deg,
                rgba(0,0,0,.25),
                transparent 50%,
                rgba(0,0,0,.3)
            );
        z-index: -1;
        pointer-events: none;
    }
    
    a {
        color: inherit;
        text-decoration: none;
    }
    
    .page {
        width: min(1180px, calc(100% - 40px));
        margin: auto;
    }
    
    header {
        padding: 70px 0 35px;
        border-bottom: 1px solid rgba(140,255,69,.14);
    }
    
    .eyebrow,
    .section-label,
    .macro-type {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 2px;
        color: var(--green);
        text-transform: uppercase;
    }
    
    h1 {
        font-size: 48px;
        line-height: 1;
        margin: 10px 0 12px;
        letter-spacing: -2px;
    }
    
    header p {
        color: var(--muted);
        font-size: 15px;
    }
    
    .back-button {
        display: inline-block;
        margin-top: 25px;
        padding: 10px 16px;
        background: rgba(16,28,19,.82);
        border: 1px solid var(--border);
        border-radius: 7px;
        color: #bdc9bf;
        font-size: 13px;
        font-weight: 700;
        transition: .2s;
    }
    
    .back-button:hover {
        color: var(--green);
        border-color: rgba(140,255,69,.45);
        background: rgba(24,42,27,.9);
        transform: translateY(-2px);
    }
    
    main {
        padding: 55px 0;
    }
    
    .section-title {
        display: flex;
        justify-content: space-between;
        align-items: end;
        margin-bottom: 22px;
    }
    
    .section-title h2 {
        font-size: 25px;
        margin-top: 7px;
        letter-spacing: -.5px;
    }
    
    .macro-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 18px;
    }
    
    .macro-card {
        background: linear-gradient(
            145deg,
            rgba(16,29,19,.96),
            rgba(9,17,12,.96)
        );
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
        cursor: pointer;
        transition: .25s;
    }
    
    .macro-card:hover {
        transform: translateY(-4px);
        border-color: rgba(140,255,69,.38);
        box-shadow: 0 12px 35px rgba(0,0,0,.3);
    }
    
    .macro-image {
        height: 260px;
        background: #0a100b;
        overflow: hidden;
        border-bottom: 1px solid var(--border);
    }
    
    .macro-image img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        transition: .35s;
    }
    
    .macro-card:hover .macro-image img {
        transform: scale(1.03);
    }
    
    .macro-content {
        padding: 22px;
    }
    
    .macro-content h3 {
        font-size: 20px;
        margin: 7px 0 8px;
    }
    
    .macro-content p {
        font-size: 13px;
        line-height: 1.6;
        color: var(--muted);
        margin-bottom: 16px;
    }
    
    .macro-content textarea {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
    }
    
    .copy-button {
        width: 100%;
        padding: 11px;
        border-radius: 6px;
        background: rgba(140,255,69,.08);
        border: 1px solid rgba(140,255,69,.22);
        color: var(--green);
        font-size: 12px;
        font-weight: 800;
        cursor: pointer;
        transition: .2s;
    }
    
    .copy-button:hover {
        background: var(--green);
        color: #071006;
    }
    
    .copy-button.copied {
        background: var(--green);
        border-color: var(--green);
        color: #071006;
    }
    
    .toast {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translate(-50%, 20px);
        padding: 11px 18px;
        background: #101b13;
        border: 1px solid rgba(140,255,69,.35);
        border-radius: 7px;
        color: var(--green);
        font-size: 12px;
        font-weight: 800;
        opacity: 0;
        pointer-events: none;
        transition: .2s;
    }
    
    .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
    }
    
    footer {
        display: flex;
        justify-content: center;
        gap: 9px;
        padding: 0 0 45px;
        color: #526057;
        font-size: 11px;
        letter-spacing: 1px;
        text-transform: uppercase;
    }
    
    @media (max-width: 750px) {
        .macro-grid {
            grid-template-columns: 1fr;
        }
    }
    
    @media (max-width: 600px) {
        .page {
            width: min(100% - 24px, 1180px);
        }
    
        header {
            padding-top: 40px;
        }
    
        h1 {
            font-size: 38px;
        }
    
        .macro-image {
            height: 220px;
        }
    }
    </style>
</head>
<body>
    <div class="page">
        <header>
            <span class="eyebrow">WORLD OF WARCRAFT</span>
            <h1>WoW Macros</h1>
            <p>Macros I use for my Evoker setups.</p>
            <a href="/WoW/" class="back-button">← Back to Main Page</a>
        </header>

        <main>
            <div class="section-title">
                <div>
                    <span class="section-label">MACROS</span>
                    <h2>Evoker Macros</h2>
                </div>
            </div>

            <div class="macro-grid">
                <article class="macro-card" onclick="copyMacro('deepbreath')">
                    <div class="macro-image">
                        <img src="images/deepbreath.png" alt="Deep Breath Screenshot">
                    </div>
                    <div class="macro-content">
                        <span class="macro-type">UTILITY</span>
                        <h3>Deep Breath</h3>
                        <p>Stops Deep Breath immediately when needed.</p>
                        <textarea id="deepbreath">#showtooltip
/cast Deep Breath
/cancelaura Deep Breath</textarea>
                        <button class="copy-button" onclick="copyMacro('deepbreath',event)">Copy Macro</button>
                    </div>
                </article>

                <article class="macro-card" onclick="copyMacro('focusinterrupt')">
                    <div class="macro-image">
                        <img src="images/interrupt.png" alt="Focus Interrupt Screenshot">
                    </div>
                    <div class="macro-content">
                        <span class="macro-type">INTERRUPT</span>
                        <h3>Focus Interrupt</h3>
                        <p>Quells your focus target, mouseover, or current target.</p>
                        <textarea id="focusinterrupt">#showtooltip Quell
/cast [@focus,exists] Quell
/cast [@mouseover,exists] Quell
/cast [@target,exists] Quell</textarea>
                        <button class="copy-button" onclick="copyMacro('focusinterrupt',event)">Copy Macro</button>
                    </div>
                </article>
            </div>
        </main>

        <footer>
            <span>12.1</span>
            <span>•</span>
            <span>Nat</span>
        </footer>
    </div>

    <div class="toast" id="toast">Macro copied!</div>

    <script>
        const toast=document.getElementById("toast");
        let toastTimer;

        function showToast(message){
            toast.textContent=message;
            toast.classList.add("show");
            clearTimeout(toastTimer);
            toastTimer=setTimeout(()=>{
                toast.classList.remove("show");
            },1500);
        }

        function copyMacro(id,event){
            if(event)event.stopPropagation();
            const textarea=document.getElementById(id);
            const button=event?event.currentTarget:null;
            navigator.clipboard.writeText(textarea.value).then(()=>{
                if(button){
                    button.classList.add("copied");
                    button.innerText="Copied!";
                    setTimeout(()=>{
                        button.classList.remove("copied");
                        button.innerText="Copy Macro";
                    },1500);
                }
                showToast("Macro copied!");
            }).catch(()=>{
                textarea.style.display="block";
                textarea.select();
                document.execCommand("copy");
                textarea.style.display="none";
                if(button){
                    button.classList.add("copied");
                    button.innerText="Copied!";
                    setTimeout(()=>{
                        button.classList.remove("copied");
                        button.innerText="Copy Macro";
                    },1500);
                }
                showToast("Macro copied!");
            });
        }
    </script>
</body>
</html>
